name: Build Signed APK

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

concurrency:
  group: "signed-build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PWD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          TMP_KEYSTORE_PATH="${RUNNER_TEMP}/keystore"
          mkdir -p "${TMP_KEYSTORE_PATH}"
          KEYSTORE_FILE="${TMP_KEYSTORE_PATH}/release_keystore.jks"

          STORE_PWD="${KEYSTORE_PWD_SECRET:-cloudstream123}"
          KEY_ALIAS="${KEY_ALIAS_SECRET:-release-key}"

          # Mask the password so it won't appear in logs
          echo "::add-mask::${STORE_PWD}"

          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_FILE}"
            echo "✅ Using existing keystore from secrets"
          else
            keytool -genkey -v \
              -keystore "${KEYSTORE_FILE}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "${KEY_ALIAS}" \
              -storepass "${STORE_PWD}" \
              -keypass "${STORE_PWD}" \
              -dname "CN=CloudStream, OU=App, O=CS, L=Unknown, ST=Unknown, C=US"
            echo ""
            echo "⚠️  Auto-generated new keystore. App updates will require reinstall."
            echo "To keep the same signing key, save this as repository secret SIGNING_KEYSTORE_BASE64:"
            echo "============================================="
            base64 -w 0 "${KEYSTORE_FILE}"
            echo ""
            echo "============================================="
          fi

          # Export for Gradle (System.getenv reads these)
          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> $GITHUB_ENV
          echo "SIGNING_KEY_ALIAS=${KEY_ALIAS}" >> $GITHUB_ENV
          echo "SIGNING_KEY_PASSWORD=${STORE_PWD}" >> $GITHUB_ENV
          echo "SIGNING_STORE_PASSWORD=${STORE_PWD}" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        run: ./gradlew assembleStableRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-signed-apk
          path: app/build/outputs/apk/stable/release/*.apk
          retention-days: 30
